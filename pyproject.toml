[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebook-factory"
version = "0.1.0"
description = "Turn Markdown manuscripts into production-ready EPUB ebooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ebook Factory" }]
dependencies = [
    "ebooklib>=0.18",
    "markdown>=3.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ebook-factory = "ebook_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["ebook_factory"]
